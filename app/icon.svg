<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background: amber-orange gradient square -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD21E"/>
      <stop offset="100%" style="stop-color:#FF9D00"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  <!-- O ring -->
  <circle cx="16" cy="16" r="9" stroke="#1C1C1C" stroke-width="3" fill="none"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="2" fill="#1C1C1C"/>
  <!-- Orbit arc diagonal -->
  <path d="M7 23 Q13 9 25 7" stroke="#1C1C1C" stroke-width="2.2" stroke-linecap="round" fill="none"/>
</svg>
